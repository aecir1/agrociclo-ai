version: '3.9'

services:
  agrociclo-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agrociclo-web
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - agrociclo-python-ml

  agrociclo-python-ml:
    image: python:3.12-slim
    container_name: agrociclo-python-ml
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    command: python backend_python/ml_server.py
